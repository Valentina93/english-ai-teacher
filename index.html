<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English AI Teacher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col justify-between font-sans">

    <!-- Header estilo App Moderna -->
    <header class="bg-white shadow-sm py-4 px-6 flex items-center justify-between border-b border-slate-100">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                AI
            </div>
            <div>
                <h1 class="text-slate-800 font-semibold text-base">English Teacher</h1>
                <p class="text-emerald-500 text-xs font-medium flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse"></span> Online
                </p>
            </div>
        </div>
    </header>

    <!-- Contenedor de Mensajes del Chat -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Mensaje de bienvenida del profesor -->
        <div class="flex items-start space-x-2">
            <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[80%] text-slate-700 text-sm leading-relaxed">
                Hello! I would love to help you practice your English today. Send me a message to get started!
            </div>
        </div>
    </main>

    <!-- Barra de Entrada de Texto -->
    <footer class="bg-white border-t border-slate-100 p-4 shadow-lg">
        <form id="chat-form" class="max-w-2xl mx-auto flex items-center space-x-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message in English..." 
                class="flex-1 bg-slate-100 border-0 rounded-full px-5 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full px-6 py-3 text-sm font-medium shadow-md transition flex items-center justify-center">
                Send
            </button>
        </form>
    </footer>

    <!-- Lógica JavaScript para conectar con nuestro backend Express -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Mostrar mensaje del usuario en pantalla
            appendMessage(text, 'user');
            userInput.value = '';

            try {
                // 2. Enviar petición POST a nuestro servidor Express
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.success) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage('Sorry, something went wrong on the server.', 'ai');
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage('Could not connect to the backend server.', 'ai');
            }
        });

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            if (sender === 'user') {
                messageDiv.className = 'flex items-end justify-end space-x-2';
                messageDiv.innerHTML = `
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[80%] text-sm leading-relaxed">
                        ${escapeHTML(text)}
                    </div>
                `;
            } else {
                messageDiv.className = 'flex items-start space-x-2';
                messageDiv.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[80%] text-slate-700 text-sm leading-relaxed">
                        ${escapeHTML(text)}
                    </div>
                `;
            }
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
